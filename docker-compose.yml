version: '3.8'

services:
  centrifugo:
    build: .
    container_name: centrifugo-server
    ports:
      - "8000:8000"
    volumes:
      - ./config.json:/centrifugo/config.json:ro
      - ./logs:/var/log/centrifugo
    environment:
      - CENTRIFUGO_PORT=8000
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: centrifugo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data:
